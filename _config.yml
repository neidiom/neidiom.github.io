about_content: |
  DevOps engineer with 20 years of hands-on experience designing, building, and managing production infrastructure — from bare metal data centers to cloud-native platforms on AWS, Azure, and GCP. Built CI/CD pipelines, monitoring systems, and event-driven automation across healthcare, fintech, entertainment, government, and managed hosting.

  **Infrastructure:** <mark>Terraform</mark>, <mark>Ansible</mark>, <mark>AWS</mark>, <mark>AWS ECS</mark>, <mark>Docker</mark>, <mark>Kubernetes</mark>, <mark>Linux</mark>. **Languages:** <mark>Python</mark>, <mark>Ruby</mark>, <mark>Golang</mark>, <mark>Bash</mark>.

  Based in Sarajevo, Bosnia & Herzegovina. Currently pursuing IT certifications — see my [![Credly Profile](./images/credly.png "Credly Profile")](https://www.credly.com/users/nedim-hadzimahmutovic) profile.

content:
  - title: Projects
    layout: list
    content:
      - layout: top-middle
        title: ProperHealth
        description: |
          Cloud infrastructure for a healthcare SaaS platform with AI-powered health coaching. *Client project at Clearview.*
          *   Provisioned 600+ AWS resources using <mark>Terraform</mark> across development and production environments.
          *   Orchestrated containerized microservices on <mark>AWS ECS</mark> Fargate including API, web admin, AI pipelines, and a medical RAG service.
          *   Managed <mark>RDS PostgreSQL</mark> with automated backups, encryption, and deletion protection.
          *   Built 77+ <mark>CloudWatch</mark> alarms and composite alarms for ECS, RDS, ALB, and EC2 monitoring.
          *   Implemented <mark>Lambda</mark>-based CI/CD automation for zero-downtime deployments across 8+ services.
          *   Configured VPC with public/private subnet isolation, <mark>Parameter Store</mark> for secrets, and IAM role separation per service.

      - layout: top-middle
        title: ASIFA Hollywood
        description: |
          Production infrastructure for the Annie Awards platform — managing awards ceremonies, member portals, and video streaming. *Client project at Clearview.*
          *   Managed 140+ <mark>Terraform</mark> files across production and staging environments with VPC peering.
          *   Deployed containerized services on <mark>AWS ECS</mark> Fargate with <mark>CodePipeline</mark> CI/CD and GitHub tag-based triggers.
          *   Configured 15+ <mark>CloudFront</mark> distributions for video streaming (HLS), submissions, and static assets.
          *   Built event-driven automation with <mark>EventBridge</mark> (10+ schedulers) routing to <mark>Lambda</mark> and Slack notifications.
          *   Authored <mark>Ruby</mark> and <mark>Python</mark> scripts for EC2 cost optimization, CloudWatch-to-Slack alerts, and operational tasks.
          *   Managed <mark>RDS MariaDB</mark>, 17+ S3 buckets, and multi-domain DNS with <mark>Route 53</mark>.

      - layout: top-middle
        title: Loop Platform
        description: |
          Full-stack audience and community engagement platform built from the ground up. *Client project at Clearview.*
          *   Developed the backend API with <mark>Golang</mark>, packaged in <mark>Docker</mark> containers.
          *   Built the frontend with <mark>React</mark>.
          *   Automated infrastructure provisioning using <mark>Terraform</mark>.
          *   Implemented CI/CD pipelines with <mark>AWS CodePipeline</mark> deploying to <mark>AWS AppRunner</mark> and <mark>S3</mark>/<mark>CloudFront</mark>.
          *   Managed secrets with <mark>AWS Parameter Store</mark>.
          *   Authored <mark>AWS Lambda</mark> functions for Slack notifications, MySQL backups, and service management.

      - layout: top-middle
        title: InvestDEFY
        description: |
          DevOps infrastructure for a crypto startup running on bare metal servers. *Client project at Clearview.*
          *   Refactored a large <mark>Ansible</mark> codebase with 50+ custom roles, splitting staging and production inventories.
          *   Deployed data mining services onto a <mark>HashiCorp Nomad</mark> cluster.
          *   Containerized multiple <mark>Golang</mark> services using <mark>Docker</mark>.
          *   Built a staging <mark>Jenkins</mark> server with configuration-as-code, <mark>Makefiles</mark>, and <mark>Jenkinsfiles</mark>.

