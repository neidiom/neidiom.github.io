about_content: |
  DevOps engineer with nearly 20 years of experience building and managing infrastructure across bare metal, private cloud, and public cloud environments. Specialized in automating cloud systems on AWS, Azure, and GCP using Terraform and Ansible. Experienced across industries including fintech, crypto, government, and managed hosting.

  Core expertise: <mark>Terraform</mark>, <mark>Ansible</mark>, <mark>AWS</mark>, <mark>AWS ECS</mark>, <mark>Docker</mark>, <mark>Kubernetes</mark>, <mark>Linux</mark>, <mark>Python</mark>, <mark>Ruby</mark>, <mark>Golang</mark>.

  Currently pursuing IT certifications — see my [![Credly Profile](./images/credly.png "Credly Profile")](https://www.credly.com/users/nedim-hadzimahmutovic) profile.

