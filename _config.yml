          *   Built the frontend with <mark>React</mark>.
          *   Automated infrastructure provisioning using <mark>Terraform</mark>.
          *   Implemented CI/CD pipelines with <mark>AWS CodePipeline</mark> deploying to <mark>AWS AppRunner</mark> and <mark>S3</mark>/<mark>CloudFront</mark>.
          *   Managed secrets with <mark>AWS Parameter Store</mark>.
          *   Authored <mark>AWS Lambda</mark> functions for Slack notifications, MySQL backups, and service management.

